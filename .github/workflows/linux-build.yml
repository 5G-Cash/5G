name: Linux build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  headless:
    name: Headless build and tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: ./scripts/install-linux-deps.sh --no-gui

      - name: Build and test
        run: ./scripts/build-linux.sh --no-gui
